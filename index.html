</style></head><body><header><div><small>地方採集誌 / FIELD NOTES</small><h1>過溪</h1></div><div class="row"><span id="progress"></span><button id="sound">音效：關</button><button id="album">明信片冊</button></div></header><nav id="tabs" aria-label="遊戲主題"></nav><main><div id="game"></div><div id="feedback" role="status" aria-live="polite"></div><div class="row"><button id="prev">← 上一頁</button><button id="retry">重新挑戰</button><button id="next">下一頁 →</button></div></main><div id="overlay" hidden></div><script>
'use strict';const $=s=>document.querySelector(s), names=['動物','人文','糖鐵','農作物','西拉雅／阿立祖','炸山資訊','獵人','竹林','華容道','地層','老照片'];const icons=['🐾','🏺','🚂','🌾','🧺','⛰️','🪶','🎋','🧩','🪨','📷'];let data={done:[],credits:0,saved:[],sound:false};try{Object.assign(data,JSON.parse(localStorage.getItem('guoxi-v1')||'{}'))}catch(e){}let page=0,cleanup=()=>{},audio,epoch=0;const save=()=>{try{localStorage.setItem('guoxi-v1',JSON.stringify(data))}catch(e){}};function tone(ok=true){if(!data.sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();[0,1,2].slice(0,ok?3:1).forEach((n)=>{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+n*.09;o.frequency.value=ok?[440,550,660][n]:180;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.17)})}catch(e){}}function msg(t,ok=true){$('#feedback').textContent=t;tone(ok)}function refresh(){ $('#progress').textContent=`完成 ${data.done.length}/11 ・ 抽取 ${data.credits} 次`;$('#sound').textContent='音效：'+(data.sound?'開':'關');$('#tabs').innerHTML=names.map((n,i)=>`<button class="${i===page?'on':''}" data-i="${i}">${icons[i]} ${n}${data.done.includes(i)?' ✓':''}</button>`).join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>openPage(+b.dataset.i));$('#prev').disabled=page===0;$('#next').disabled=page===10}function modal(html){let o=$('#overlay');o.hidden=false;o.className='overlay';o.innerHTML=`<section class="modal" role="dialog" aria-modal="true">${html}</section>`;o.querySelector('button')?.focus()}function closeModal(){let o=$('#overlay');o.hidden=true;o.className='';o.innerHTML=''}function win(){if(finished)return;finished=true;cleanup();cleanup=()=>{};let fresh=!data.done.includes(page);if(fresh){data.done.push(page);data.credits++;save()}refresh();tone();modal(`<div class="pop"><div class="big">${icons[page]} ✦</div><span class="stamp">探索完成</span><h2>${names[page]}・採集成功</h2><p>${fresh?'獲得一次明信片抽取機會！':'已完成過，不重複發放抽取機會。'}</p></div><div class="row" style="justify-content:center"><button id="continue">繼續探索</button><button id="draw" ${data.done.length<3?'disabled':''}>抽取明信片</button><button id="stay">留在本頁</button></div>${data.done.length<3?'<small>完成至少三個不同主題後即可選擇三個元素。</small>':''}`);$('#continue').onclick=()=>{closeModal();openPage(Math.min(10,page+1))};$('#draw').onclick=collection;$('#stay').onclick=closeModal}let finished=false;function openPage(i){cleanup();cleanup=()=>{};epoch++;finished=false;page=i;closeModal();refresh();$('#feedback').textContent='';$('#game').innerHTML=`<small>採集頁 ${String(i+1).padStart(2,'0')} / 11 ${data.done.includes(i)?'・已完成':''}</small><h2>${icons[i]} ${names[i]}</h2><div id="play"></div>`;games[i]();$('#tabs .on')?.scrollIntoView({block:'nearest',inline:'nearest'})}const play=()=>$('#play');const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function buttons(items,fn,cols=3){let d=document.createElement('div');d.className='board';d.style.gridTemplateColumns=`repeat(${cols},1fr)`;items.forEach((v,i)=>{let b=document.createElement('button');b.className='tile';b.innerHTML=v;b.onclick=()=>{if(!finished)fn(i,b)};d.append(b)});play().append(d);return d}function intro(t){play().innerHTML=`<p>${t}</p>`}function loop(fn){let id,live=true,last=performance.now();function frame(t){if(!live)return;fn(Math.min(.05,(t-last)/1000),t);last=t;if(live)id=requestAnimationFrame(frame)}id=requestAnimationFrame(frame);cleanup=()=>{live=false;cancelAnimationFrame(id)}}function svgStage(content=''){let d=document.createElement('div');d.className='stage';d.innerHTML=`<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">${content}</svg>`;play().append(d);return d}function pos(e,d){let r=d.getBoundingClientRect();return [(e.clientX-r.left)*500/r.width,(e.clientY-r.top)*300/r.height]}function action(label,fn){let b=document.createElement('button');b.textContent=label;b.onclick=()=>{if(!finished)fn()};play().append(b);return b}
function animal(){let qs=[['夜間活動、長鼻子、身體有鱗片',['穿山甲','山羌','白鷺鷥'],0,'穿山甲以螞蟻和白蟻為食。'],['樹上跳躍、長尾巴、群體活動',['山羌','臺灣獼猴','穿山甲'],1,'臺灣獼猴常以果實、嫩葉等為食。'],['細長腳、白色羽毛、在水邊覓食',['白鷺鷥','臺灣獼猴','山羌'],0,'白鷺鷥常在淺水處尋找小魚等食物。']];let n=0;function draw(){let q=qs[n];intro(`線索 ${n+1}/3：${q[0]}`);buttons(q[1],(i)=>{if(i!==q[2])return msg('再觀察一下線索！',false);msg(q[3]);play().querySelectorAll('button').forEach(b=>b.disabled=true);action(n===2?'完成採集':'下一個線索',()=>{n++;n===3?win():draw()})})}draw()}
function memory(){intro('翻開兩張卡，找出四組相同的生活物件。');let a=shuffle(['🏺','🏺','🧺','🧺','🪭','🪭','🪔','🪔']), first=-1,locked=false,done=new Set(),timer;let d=buttons(a.map(()=>'?'),(i,b)=>{if(locked||done.has(i)||i===first)return;b.textContent=a[i];if(first<0){first=i;return}let j=first;first=-1;if(a[i]===a[j]){done.add(i);done.add(j);msg('找到一組！');if(done.size===8)win()}else{locked=true;msg('不是同一組，再試一次',false);timer=setTimeout(()=>{d.children[i].textContent=d.children[j].textContent='?';locked=false},650)}},4);cleanup=()=>clearTimeout(timer)}
function rail(){intro('點擊軌道旋轉 90°，讓左側車站連到右側終點。');let goal=[10,12,0,0,0,0,3,12,0,0,0,0,3,10,10],a=goal.map(v=>{let k=1+Math.floor(Math.random()*3);while(k--)v=((v<<1)|(v>>3))&15;return v});function piece(v){return `<svg viewBox="0 0 60 60" width="100%"><circle cx="30" cy="30" r="5" fill="#bc4e36"/>${[[30,0],[60,30],[30,60],[0,30]].map(([x,y],i)=>v&(1<<i)?`<path d="M30 30 L${x} ${y}" stroke="#383a35" stroke-width="10"/><path d="M30 30 L${x} ${y}" stroke="#d8b67b" stroke-width="4"/>`:'').join('')}</svg>`}function check(){let x=0,y=0,entry=3,seen=new Set();while(x>=0&&x<5&&y>=0&&y<3){let i=y*5+x,v=a[i];if(seen.has(i)||!(v&(1<<entry)))return false;seen.add(i);let out=[0,1,2,3].find(k=>k!==entry&&(v&(1<<k)));if(out===undefined)return false;x+=[0,1,0,-1][out];y+=[-1,0,1,0][out];entry=(out+2)%4;if(x===5&&y===2)return true}return false}let d=buttons(a.map(piece),(i,b)=>{a[i]=((a[i]<<1)|(a[i]>>3))&15;b.innerHTML=piece(a[i]);if(check())win();else msg('軌道已旋轉')},5);d.insertAdjacentHTML('beforebegin','<small>🚂 起點：左上角向左開口</small>');d.insertAdjacentHTML('afterend','<small>終點：右下角向右開口 →</small>')}
function crops(){intro('選擇兩種材料，完成三種合理的農產料理。');let a=['甘蔗','水','米','地瓜','麵粉','破布子','魚'],recipes=[['甘蔗','水','甘蔗汁（榨汁後可加水調整濃度）'],['地瓜','麵粉','地瓜餅'],['破布子','魚','破布子蒸魚']],sel=[],done=new Set();buttons(a,(i,b)=>{if(sel.includes(i)){sel=sel.filter(x=>x!==i);b.classList.remove('on');return}sel.push(i);b.classList.add('on');if(sel.length===2){let r=recipes.findIndex(x=>sel.every(j=>x.slice(0,2).includes(a[j])));document.querySelectorAll('.tile').forEach(x=>x.classList.remove('on'));sel=[];if(r<0)return msg('這組材料不在本頁食譜中',false);done.add(r);msg('合成成功：'+recipes[r][2]);$('#recipeCount').textContent=`已完成 ${done.size}/3`;if(done.size===3)win()}});play().insertAdjacentHTML('beforeend','<p id="recipeCount">已完成 0/3</p><small>提示：甘蔗＋水、地瓜＋麵粉、破布子＋魚。</small>')}
function basket(){intro('移動手指或滑鼠控制籃子，接住小米（🌾）與果實（🍊），避開石頭。收集 10 個。此為示意玩法，文化內容待地方資料確認。');let d=svgStage(),s=d.firstChild,x=250,score=0,objects=[],clock=0;function move(e){x=Math.max(33,Math.min(467,pos(e,d)[0]))}d.onpointerdown=e=>{d.setPointerCapture(e.pointerId);move(e)};d.onpointermove=move;let key=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();x=Math.max(33,Math.min(467,x+(e.key==='ArrowLeft'?-9:9)))}};window.addEventListener('keydown',key);loop((dt)=>{clock+=dt;if(clock>.65){clock=0;let xx=25+Math.random()*450;if(objects.some(o=>o.y<95&&Math.abs(o.x-xx)<70))return;objects.push({x:xx,y:-15,type:Math.random()<.25?'🪨':Math.random()<.5?'🌾':'🍊'})}for(let o of objects){o.y+=dt*90;if(o.y>=253&&o.y<=276&&Math.abs(o.x-x)<38&&!o.hit){o.hit=true;if(o.type==='🪨'){score=Math.max(0,score-1);msg('石頭扣一分',false)}else{score++;msg(`收集 ${score}/10`);if(score>=10){win();return}}}}objects=objects.filter(o=>!o.hit&&o.y<325);s.innerHTML=`<rect width="500" height="300" fill="#e9d8af"/><path d="M0 280 Q120 260 250 280 T500 280 V300 H0Z" fill="#889574"/>${objects.map(o=>`<text x="${o.x}" y="${o.y}" text-anchor="middle" dominant-baseline="central" font-size="28">${o.type}</text>`).join('')}<path d="M${x-38} 253 L${x-27} 287 H${x+27} L${x+38} 253Z" fill="#b87d42" stroke="#544638" stroke-width="3"/><path d="M${x-33} 263 H${x+33} M${x-30} 273 H${x+30}" stroke="#f5d29c" stroke-width="3"/><text x="12" y="24" font-size="17">${score}/10</text>`});let old=cleanup;cleanup=()=>{old();window.removeEventListener('keydown',key)}}
function timing(){intro('指標進入橘紅色區域時，點擊軌道或下方按鈕。成功三次。此為反應練習，不模擬實際爆破。');let d=svgStage(),s=d.firstChild,score=0,center=250,start=performance.now(),last=-Infinity,shown=45;const at=t=>45+410*(1-Math.abs(((t-start)/1200)%2-1));function hit(){let t=performance.now();if(t-last<280||finished)return;last=t;let x=shown;if(Math.abs(x-center)<=51){score++;msg(`成功 ${score}/3`);if(score===3)return win();center=100+Math.random()*300}else msg('未進入目標區，再試一次',false)}d.onpointerdown=hit;action('現在！',hit);loop((dt,t)=>{s.innerHTML=`<rect x="45" y="130" width="410" height="40" rx="8" fill="#b9ad96"/><rect x="${center-48}" y="130" width="96" height="40" fill="#bc4e36"/><path d="M${shown=at(t)} 108 V190" stroke="#383a35" stroke-width="7"/><text x="250" y="65" text-anchor="middle" font-size="24">成功 ${score}/3</text>`})}
function hunter(){intro('點擊遊戲場景或放下抓鉤按鈕，收集地下的三件採集物（避開石頭）。');let d=svgStage(),s=d.firstChild,items=[{x:90,y:175,t:'🌰'},{x:248,y:234,t:'🪵'},{x:410,y:185,t:'🍂'},{x:165,y:240,t:'🪨'},{x:340,y:135,t:'🪨'}],a=0,len=28,mode=0,got=null,score=0,clock=0;function fire(){if(!mode&&!finished)mode=1}d.onpointerdown=fire;action('放下抓鉤',fire);loop(dt=>{clock+=dt;if(!mode)a=Math.sin(clock*1.8)*1.06;else if(mode===1){len+=dt*260;let x=250+Math.sin(a)*len,y=35+Math.cos(a)*len;let o=items.find(o=>Math.hypot(o.x-x,o.y-y)<23);if(o){got=o;items=items.filter(v=>v!==o);mode=2}else if(y>292||x<10||x>490)mode=2}else{len-=dt*(got?.t==='🪨'?115:220);if(len<=28){len=28;mode=0;if(got){if(got.t==='🪨'){items.push(got);msg('抓到石頭，再試一次',false)}else{score++;msg(`採集 ${score}/3`)}got=null;if(score===3)return win()}}}let x=250+Math.sin(a)*len,y=35+Math.cos(a)*len;s.innerHTML=`<rect width="500" height="300" fill="#c6aa82"/><path d="M0 80 Q125 65 250 80 T500 80 V0 H0Z" fill="#e9d9ad"/><path d="M0 150 H500 M0 250 H500" stroke="#a98a64" stroke-dasharray="8 12"/>${items.map(o=>`<text x="${o.x}" y="${o.y}" text-anchor="middle" dominant-baseline="central" font-size="28">${o.t}</text>`).join('')}<circle cx="250" cy="35" r="16" fill="#687b60" stroke="#383a35" stroke-width="4"/><path d="M250 35 L${x} ${y}" stroke="#383a35" stroke-width="3"/><g transform="translate(${x} ${y}) rotate(${-a*180/Math.PI})"><circle r="6" fill="#d6ad72" stroke="#383a35" stroke-width="2"/><path d="M-3 3 Q-19 5 -13 19 L-5 23 M3 3 Q19 5 13 19 L5 23" fill="none" stroke="#383a35" stroke-width="5" stroke-linecap="round"/></g>${got?`<text x="${x}" y="${y+22}" text-anchor="middle" font-size="24">${got.t}</text>`:''}<text x="12" y="25">${score}/3</text>`})}
function bamboo(){let score=0;function draw(){intro(`切割竹子，不要切到其他物品。每點一次就重新排列。 ${score}/8`);let a=shuffle(['🎋','🎋','🍂','🪨','🍄','🪵']).slice(0,4);if(!a.includes('🎋'))a[Math.floor(Math.random()*4)]='🎋';buttons(a,i=>{if(a[i]==='🎋'){score++;msg('切割成功！');if(score===8)return win()}else{score=Math.max(0,score-1);msg('切到其他物件，扣一分',false)}draw()},2)}draw()}
function escapeGame(){intro('移動長方形木塊：橫向只能左右、直向只能上下。讓橘紅色木塊從右側箭頭離開。');let blocks=[{x:0,y:2,w:2,h:1,c:'#bc4e36'}, {x:5,y:1,w:1,h:2},{x:2,y:3,w:2,h:1},{x:1,y:5,w:2,h:1},{x:2,y:0,w:1,h:3},{x:0,y:4,w:2,h:1},{x:1,y:0,w:1,h:2},{x:4,y:1,w:1,h:2},{x:3,y:0,w:3,h:1},{x:3,y:4,w:3,h:1},{x:4,y:5,w:2,h:1}],d=svgStage(),s=d.firstChild,selected=0;function draw(){s.innerHTML=`<rect x="100" y="0" width="300" height="300" fill="#cbb58e"/>${Array.from({length:7},(_,i)=>`<path d="M${100+i*50} 0V300 M100 ${i*50}H400" stroke="#a28e70"/>`).join('')}<path d="M400 125H465m-15 -12 15 12 -15 12" stroke="#bc4e36" stroke-width="5" fill="none"/><text x="410" y="102" fill="#bc4e36">出口</text>${blocks.map((b,i)=>`<rect x="${102+b.x*50}" y="${2+b.y*50}" width="${b.w*50-4}" height="${b.h*50-4}" rx="5" fill="${b.c||'#827c5f'}" stroke="${i===selected?'#fff4d5':'#544638'}" stroke-width="${i===selected?4:1}"/><text x="${100+(b.x+b.w/2)*50}" y="${(b.y+b.h/2)*50+5}" text-anchor="middle" fill="white">${i===0?'目標':i}</text>`).join('')}` }function move(dx,dy){if(finished)return;let b=blocks[selected];if((b.w>1&&dy)||(b.h>1&&dx))return msg('只能沿木塊長邊移動',false);let x=b.x+dx,y=b.y+dy;if(selected===0&&x===5&&y===2&& !blocks.some((o,i)=>i!==0&&o.x<=5&&o.x+o.w>5&&o.y<=2&&o.y+o.h>2))return win();if(x<0||y<0||x+b.w>6||y+b.h>6||blocks.some((o,i)=>i!==selected&&x<o.x+o.w&&x+b.w>o.x&&y<o.y+o.h&&y+b.h>o.y))return msg('有障礙物',false);b.x=x;b.y=y;draw();msg('木塊已移動')}let p;d.onpointerdown=e=>{p=pos(e,d);let x=Math.floor((p[0]-100)/50),y=Math.floor(p[1]/50);let i=blocks.findIndex(b=>x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h);if(i>=0){selected=i;draw()}d.setPointerCapture(e.pointerId)};d.onpointerup=e=>{if(!p)return;let q=pos(e,d),dx=q[0]-p[0],dy=q[1]-p[1];if(Math.max(Math.abs(dx),Math.abs(dy))>15&&!finished)Math.abs(dx)>Math.abs(dy)?move(Math.sign(dx),0):move(0,Math.sign(dy));p=null};let r=document.createElement('div');r.className='row';[['←',-1,0],['↑',0,-1],['↓',0,1],['→',1,0]].forEach(([l,x,y])=>{let b=document.createElement('button');b.textContent=l;b.onclick=()=>{if(!finished)move(x,y)};r.append(b)});play().append(r);draw()}
function geology(){intro('拖動探照燈，在暗處找出三個標記物：貝殼、化石示意、礦石。點擊找到的物件。');let d=svgStage(),s=d.firstChild,x=-100,y=-100,found=0,items=shuffle(['🐚','🦴','💎','🪨','🪨','🍂','🪵','🪨','🌿','🪨','🍂','🪨','🪵','🪨','🌿','🪨','🍂','🪨','🪨','🌿']).map((t,i)=>({t,x:45+i%5*100+Math.random()*20,y:30+Math.floor(i/5)*78+Math.random()*13}));function draw(){s.innerHTML=`<defs><clipPath id="light"><circle cx="${x}" cy="${y}" r="65"/></clipPath></defs><rect width="500" height="300" fill="#292c29"/><g clip-path="url(#light)"><rect width="500" height="300" fill="#b7a27c"/>${items.map(o=>`<text x="${o.x}" y="${o.y}" text-anchor="middle" dominant-baseline="central" font-size="26">${o.t}</text>`).join('')}</g><circle cx="${x}" cy="${y}" r="65" fill="none" stroke="#e7d19a" stroke-width="2"/><text x="10" y="20" fill="#eee2c8">${found}/3</text>`}d.onpointermove=e=>{[x,y]=pos(e,d);draw()};let down;d.onpointerdown=e=>{[x,y]=pos(e,d);down=[x,y];d.setPointerCapture(e.pointerId);draw()};d.onpointerup=e=>{[x,y]=pos(e,d);if(down&&Math.hypot(x-down[0],y-down[1])<15){let o=items.find(o=>Math.hypot(o.x-x,o.y-y)<22);if(o&&['🐚','🦴','💎'].includes(o.t)){items=items.filter(v=>v!==o);found++;msg(`找到標記 ${found}/3`);if(found===3)return win()}else if(o)msg('這不是指定標記',false)}draw()};draw()}
const photo=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="#c9b394"/><circle cx="235" cy="50" r="32" fill="#ead7ae"/><path d="M0 130L80 45 155 135 235 75 300 130V300H0Z" fill="#88866e"/><path d="M0 180Q150 140 300 180V300H0Z" fill="#a89b78"/><path d="M40 160L110 105 180 160V240H40Z" fill="#e2c8a0"/><path d="M25 160L110 93 195 160Z" fill="#775b46"/><rect x="90" y="181" width="40" height="59" fill="#6e6450"/><path d="M170 300Q200 210 300 200" stroke="#e9d6af" stroke-width="45" fill="none"/><text x="150" y="282" text-anchor="middle" font-size="17" fill="#514638">過溪・示意圖</text></svg>`;const photoURL='data:image/svg+xml,'+encodeURIComponent(photo);function puzzle(){intro('依照左上到右下 1～8 的順序排列，空格放右下。點擊或滑動相鄰拼圖。完成後顯示整張示意圖。');let a=[0,1,2,3,4,5,6,7,8],blank=8;for(let k=0;k<24;k++){let n=a.map((_,i)=>i).filter(i=>Math.abs(i%3-blank%3)+Math.abs(Math.floor(i/3)-Math.floor(blank/3))===1);let j=n[Math.floor(Math.random()*n.length)];[a[j],a[blank]]=[a[blank],a[j]];blank=j}if(a.every((v,i)=>v===i)){[a[7],a[8]]=[a[8],a[7]];blank=7}let ref=document.createElement('div');ref.innerHTML='<small>排列參考：1 2 3 ／ 4 5 6 ／ 7 8 空</small>';let im=document.createElement('img');im.src=photoURL;im.alt='完整示意圖';im.width=100;im.style.display='block';ref.append(im);play().append(ref);let d=buttons(a.map(()=>''),(i)=>move(i),3);function move(i){if(finished||Math.abs(i%3-blank%3)+Math.abs(Math.floor(i/3)-Math.floor(blank/3))!==1)return;[a[i],a[blank]]=[a[blank],a[i]];blank=i;draw();if(a.every((v,i)=>v===i)){d.innerHTML=`<img alt="完成圖片" src="${photoURL}" style="width:100%;grid-column:1/-1">`;win()}}function draw(){a.forEach((v,i)=>{let b=d.children[i];b.textContent=v===8?'':v+1;b.style.backgroundImage=v===8?'none':`url("${photoURL}")`;b.style.backgroundSize='300% 300%';b.style.backgroundPosition=`${v%3*50}% ${Math.floor(v/3)*50}%`;b.style.color='white';b.style.textShadow='0 1px 3px black';b.setAttribute('aria-label',v===8?'空格':`圖片 ${v+1}`)})}draw();let start;d.style.touchAction='none';d.onpointerdown=e=>{let b=e.target.closest('button');if(b)start={i:[...d.children].indexOf(b),x:e.clientX,y:e.clientY}};d.onpointerup=e=>{if(start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>15){move(start.i);e.preventDefault()}start=null}}
const games=[animal,memory,rail,crops,basket,timing,hunter,bamboo,escapeGame,geology,puzzle];const postcards=[{name:'溪畔生息',tags:[0,9,7],color:'#71856a',motif:'🐾'},{name:'歲月留影',tags:[1,10,8],color:'#a17b58',motif:'📷'},{name:'糖鐵慢行',tags:[2,3,10],color:'#b65d42',motif:'🚂'},{name:'山林採集',tags:[6,7,9,5],color:'#687b60',motif:'🎋'},{name:'土地記憶',tags:[4,5,1,3],color:'#ad754d',motif:'🌾'}];function card(i){let p=postcards[i];return `<div class="postcard"><svg viewBox="0 0 400 230" role="img" aria-label="${p.name}"><rect width="400" height="230" fill="#ecd7ae"/><circle cx="320" cy="45" r="32" fill="#c45d43"/><path d="M0 145L90 42 180 140 265 75 400 145V230H0Z" fill="${p.color}"/><path d="M0 185Q100 125 200 185T400 180V230H0Z" fill="#b9a27a"/><path d="M0 215Q100 165 210 205T400 195" stroke="#f5e8cc" stroke-width="18" fill="none"/><text x="200" y="145" font-size="65" text-anchor="middle">${p.motif}</text><text x="18" y="28" font-size="15" fill="#383a35">GUOXI / 過溪</text></svg><p>${p.name} ・ 地方採集明信片</p></div>`}function collection(){let selected=[];function draw(){modal(`<h2>明信片採集冊</h2><p>剩餘抽取 ${data.credits} 次・選擇三個已完成主題</p><div class="row" id="choices" style="justify-content:center">${names.map((n,i)=>`<button data-i="${i}" ${!data.done.includes(i)?'disabled':''} class="${selected.includes(i)?'on':''}">${icons[i]} ${n}</button>`).join('')}</div><p id="picked">已選 ${selected.length}/3</p><button id="reveal" ${selected.length!==3||!data.credits?'disabled':''}>抽取明信片</button> <button id="saved">收藏冊 (${data.saved.length})</button> <button id="close">關閉</button>`);$('#choices').querySelectorAll('button').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(selected.includes(i))selected=selected.filter(x=>x!==i);else if(selected.length<3)selected.push(i);draw()});$('#close').onclick=closeModal;$('#saved').onclick=showSaved;$('#reveal').onclick=()=>{let scores=postcards.map(p=>p.tags.filter(t=>selected.includes(t)).length),max=Math.max(...scores),best=scores.indexOf(max);result(best)}}function result(i){modal(`<div class="pop"><span class="stamp">採集配對完成</span>${card(i)}</div><p>依照你選擇的三項元素推薦。</p><button id="keep">收藏這張（使用一次機會）</button> <button id="change">重新選擇元素</button> <button id="cancel">取消</button>`);tone();$('#change').onclick=draw;$('#cancel').onclick=closeModal;$('#keep').onclick=()=>{if(!data.credits)return;data.credits--;data.saved.push({i,selected:[...selected]});save();refresh();showSaved()}}draw()}function showSaved(){modal(`<h2>我的收藏冊</h2>${data.saved.length?data.saved.map((p)=>card(p.i)).join(''):'<p>還沒有收藏，先去探索吧！</p>'}<button id="back">返回抽取</button> <button id="close">關閉</button>`);$('#back').onclick=collection;$('#close').onclick=closeModal}$('#sound').onclick=()=>{data.sound=!data.sound;save();refresh();tone()};$('#album').onclick=collection;$('#prev').onclick=()=>openPage(page-1);$('#next').onclick=()=>openPage(page+1);$('#retry').onclick=()=>openPage(page);openPage(0);
</script></body></html>
